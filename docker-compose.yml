name: chipsupply-stack

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_prometheus && rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-chipsupply}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASSWORD:?请在 .env 设置 RABBITMQ_DEFAULT_PASSWORD}
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  erp:
    build: ../ChipSupply-Teaching-Platform
    environment:
      CHIP_DB_URL: jdbc:mysql://mysql:3306/chip_supply_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      CHIP_DB_USER: root
      CHIP_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CHIP_REDIS_HOST: redis
      CHIP_REDIS_PORT: 6379
      CHIP_RABBITMQ_HOST: rabbitmq
      CHIP_RABBITMQ_PORT: 5672
      CHIP_RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-chipsupply}
      CHIP_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASSWORD}
      CHIP_BOOTSTRAP_PASSWORD: ${CHIP_BOOTSTRAP_PASSWORD:?请设置 CHIP_BOOTSTRAP_PASSWORD}
      CHIP_AGENT_PASSWORD: ${CHIP_AGENT_PASSWORD:?请设置 CHIP_AGENT_PASSWORD}
      CHIP_JWT_SECRET: ${CHIP_JWT_SECRET:?请设置 CHIP_JWT_SECRET}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      CHIP_TRACE_SAMPLING: "1.0"
    ports: ["8082:8082"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  mcp:
    build: ../ChipChain-Procurement-Agent
    command: ["python", "-m", "mcp_server.server_main"]
    environment:
      JAVA_API_BASE_URL: http://erp:8082/api
      JAVA_API_USERNAME: procurement_agent
      JAVA_API_PASSWORD: ${CHIP_AGENT_PASSWORD}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: chipchain-mcp
    ports: ["8000:8000"]
    depends_on: [erp]
    restart: on-failure

  agent-api:
    build: ../ChipChain-Procurement-Agent
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?请设置 DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      ERP_MCP_URL: http://mcp:8000/mcp
      ANALYSIS_MCP_URL: ${ANALYSIS_MCP_URL:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: agent_db
      MYSQL_AUTO_CREATE_DATABASE: "true"
      SANDBOX_DOMAIN: ${SANDBOX_DOMAIN:-http://host.docker.internal:8080}
      SANDBOX_API_KEY: ${SANDBOX_API_KEY:-}
      CORS_ORIGINS: http://localhost:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: chipchain-procurement-agent
      DEEPSEEK_INPUT_USD_PER_M_TOKENS: ${DEEPSEEK_INPUT_USD_PER_M_TOKENS:-0.28}
      DEEPSEEK_OUTPUT_USD_PER_M_TOKENS: ${DEEPSEEK_OUTPUT_USD_PER_M_TOKENS:-0.42}
    ports: ["8090:8090"]
    depends_on:
      mysql: {condition: service_healthy}
      mcp: {condition: service_started}
    restart: on-failure

  frontend:
    build: ../ChipChain-Procurement-Agent/frontend
    ports: ["3000:80"]
    depends_on: [agent-api]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes: ["./ops/otel-collector/config.yml:/etc/otelcol/config.yml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [tempo]

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./ops/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [erp, agent-api, rabbitmq]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, tempo]

  observability:
    build: .
    ports: ["3002:80"]
    depends_on: [prometheus, grafana]
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
  tempo-data:
