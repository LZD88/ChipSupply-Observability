global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s

scrape_configs:
  - job_name: chipsupply-erp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:8082"]
  - job_name: procurement-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8090"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["127.0.0.1:15692"]
