global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: chipsupply-erp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["erp:8082"]
  - job_name: procurement-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-api:8090"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
