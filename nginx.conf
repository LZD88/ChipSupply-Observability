server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /prometheus/ {
    proxy_pass http://prometheus:9090/;
    proxy_http_version 1.1;
    proxy_set_header Host prometheus;
    proxy_set_header Cookie "";
    proxy_read_timeout 15s;
  }

  location = /telemetry/prometheus/ready {
    proxy_pass http://prometheus:9090/-/ready;
    proxy_set_header Cookie "";
    proxy_read_timeout 3s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  location = /telemetry/tempo/ready {
    proxy_pass http://tempo:3200/ready;
    proxy_set_header Cookie "";
    proxy_read_timeout 3s;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
  }

  # Authenticated quality reports only. The browser's /api-scoped HttpOnly
  # session cookie is forwarded by Nginx, while mutating methods are denied.
  location /api/evaluations/ {
    limit_except GET { deny all; }
    proxy_pass http://agent-api:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 30s;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
  }

  # Never fall through to index.html for non-whitelisted API or evidence paths.
  location /api/ {
    return 404;
  }

  location /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
