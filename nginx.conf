server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /prometheus/ {
    proxy_pass http://prometheus:9090/;
    proxy_http_version 1.1;
    proxy_set_header Host prometheus;
    proxy_read_timeout 15s;
  }

  location /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
